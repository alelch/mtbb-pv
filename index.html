<script>
  // A/B/C da PORTA = FUNDO. Sorteio sticky por % (peso vem do cache 'mtbb_cfg_quiz', default 33/33/33)
  // feito ANTES do paint (sem flash). O rodapé atualiza esse cache a cada visita com o % do admin.
  (function () {
    function wpick(keys, w){var t=0,i;for(i=0;i<keys.length;i++)t+=Math.max(0,Number(w[keys[i]])||0);if(t<=0)return keys[Math.floor(Math.random()*keys.length)];var r=Math.random()*t,a=0;for(i=0;i<keys.length;i++){a+=Math.max(0,Number(w[keys[i]])||0);if(r<a)return keys[i];}return keys[keys.length-1];}
    var KEY = 'mtbb_quiz_ab', AB = ['a', 'b', 'c'], v;
    try { v = localStorage.getItem(KEY); } catch (e) {}
    if (AB.indexOf(v) === -1) {
      var w = { a: 34, b: 33, c: 33 };
      try { var c = JSON.parse(localStorage.getItem('mtbb_cfg_quiz') || 'null'); if (c && typeof c === 'object') w = c; } catch (e) {}
      v = wpick(AB, w);
      try { localStorage.setItem(KEY, v); } catch (e) {}
    }
    window.MTBB_QUIZ_VARIANT = v;
    document.documentElement.setAttribute('data-quiz', v);
  })();
</script>

  <script>
    // Roteador de tráfego (config: mtbb_traffic_config no Supabase)
    // - PÁGINA preço/lista: split GLOBAL (vale pros 3 estágios), sticky por visitante
    // - cacheia o % do quiz em 'mtbb_cfg_quiz' pro head script da próxima visita (sem flash)
    // - injeta utm_test=<preco|lista>-<stage> pro cruzamento no Hotmart
    (function() {
      function wpick(keys, w){var t=0,i;for(i=0;i<keys.length;i++)t+=Math.max(0,Number(w[keys[i]])||0);if(t<=0)return keys[Math.floor(Math.random()*keys.length)];var r=Math.random()*t,a=0;for(i=0;i<keys.length;i++){a+=Math.max(0,Number(w[keys[i]])||0);if(r<a)return keys[i];}return keys[keys.length-1];}

      // preço/lista é GLOBAL (não mais por estágio). Sticky no visitante.
      function getStickyPagina(dist) {
        var key = 'mtbb_pagina_ab';
        try {
          var saved = localStorage.getItem(key);
          if (saved === 'preco' || saved === 'lista') return saved;
        } catch (e) {}
        var variant = wpick(['preco', 'lista'], dist || { preco: 50, lista: 50 });
        try { localStorage.setItem(key, variant); } catch (e) {}
        return variant;
      }

      function buildHref(stage, variant) {
        var base = (variant === 'lista') ? (stage + '-lista') : (stage);
        var utms = (window.MTBB_UTMS && window.MTBB_UTMS()) || {};
        utms.utm_test = variant + '-' + stage;
        var parts = [];
        Object.keys(utms).forEach(function (k) {
          parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(utms[k]));
        });
        return base + (parts.length ? '?' + parts.join('&') : '');
      }

      // Fonte da verdade: Supabase (mtbb_traffic_config).
      var SB_URL = 'https://jsqtpsxpaclslakafmvd.supabase.co';
      var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzcXRwc3hwYWNsc2xha2FmbXZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMTY5NTMsImV4cCI6MjA5MDg5Mjk1M30.6f3CmgozaE3fTORF0SBSeRDzZNZ1E27tcdQ9h6tKLgc';

      function apply(dists) {
        // cacheia o % do quiz pro head script da próxima visita (decisão pré-paint, sem flash)
        try { if (dists.quiz) localStorage.setItem('mtbb_cfg_quiz', JSON.stringify(dists.quiz)); } catch (e) {}
        var pagina = getStickyPagina(dists.pagina);
        document.querySelectorAll('.option[data-stage]').forEach(function(el) {
          var stage = el.getAttribute('data-stage');
          el.setAttribute('href', buildHref(stage, pagina));
          el.addEventListener('click', function () {
            if (window.MTBB_TRACK) window.MTBB_TRACK('stage_click', { stage: stage, variant: pagina });
          });
        });
      }

      var DEFAULTS = { quiz: { a:34, b:33, c:33 }, pagina: { preco:50, lista:50 }, obrigado: { carta:34, bento:33, conversa:33 } };
      fetch(SB_URL + '/rest/v1/mtbb_traffic_config?select=key,dist', {
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
      })
        .then(function (r) { return r.json(); })
        .then(function (rows) {
          if (!Array.isArray(rows) || rows.length === 0) throw new Error('empty');
          var d = {};
          rows.forEach(function (r) { d[r.key] = r.dist; });
          apply({ quiz: d.quiz || DEFAULTS.quiz, pagina: d.pagina || DEFAULTS.pagina, obrigado: d.obrigado || DEFAULTS.obrigado });
        })
        .catch(function () { apply(DEFAULTS); });
    })();
  </script>
