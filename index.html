<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTBB · Em que momento está o seu livro?</title>
<meta name="description" content="Identifique o momento do seu livro e veja o caminho pra ele chegar aos leitores certos.">
<meta property="og:type" content="website">
<meta property="og:title" content="MTBB · Em que momento está o seu livro?">
<meta property="og:description" content="Identifique o momento do seu livro e veja o caminho pra ele chegar aos leitores certos.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fraunces:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F8F8F8;
    --bg-card: #FFFFFF;
    --bg-card-hover: #FFFFFF;
    --accent: #FAAB00;
    --text: #1A1A1A;
    --text-soft: #555555;
    --text-mute: #999999;
    --border: #EEEEEE;
  }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 40px 24px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 880px;
    width: 100%;
    margin: auto;
    text-align: center;
  }
  .logo {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
    margin-bottom: 36px;
  }
  .logo span { color: var(--accent); }
  h1 {
    font-size: clamp(30px, 5vw, 52px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin-bottom: 56px;
  }
  h1 .italic {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    max-width: 720px;
    margin: 0 auto;
  }
  @media (min-width: 760px) {
    .options { grid-template-columns: repeat(3, 1fr); gap: 18px; }
  }
  .option {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 32px 28px 28px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.25s ease;
    position: relative;
    min-height: 200px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    overflow: hidden;
  }
  .option::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--accent);
  }
  .option:hover,
  .option:active {
    border-color: var(--accent);
    transform: translateY(-6px);
    box-shadow: 0 22px 48px rgba(250,171,0,0.22), 0 4px 14px rgba(0,0,0,0.06);
  }
  .option:hover .arrow,
  .option:active .arrow {
    transform: translateX(4px);
  }
  .option:hover .arrow-circle,
  .option:active .arrow-circle {
    background: var(--accent);
    color: #0A0A0A;
  }
  .option .label {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 28px;
    color: var(--text);
  }
  .arrow {
    margin-top: auto;
    align-self: flex-end;
    transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: inline-block;
  }
  .arrow-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(250,171,0,0.12);
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    transition: all 0.25s ease;
  }
  footer {
    margin-top: 64px;
    font-size: 12px;
    color: var(--text-mute);
    text-align: center;
    line-height: 1.6;
  }
</style>
<script src="utm.js" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="logo">MTBB<span>.</span></div>

    <h1>Em que momento está<br><span class="italic">o seu livro hoje?</span></h1>

    <div class="options">
      <a class="option" data-stage="escrevendo" href="escrevendo.html">
        <div class="label">Ainda estou escrevendo</div>
        <span class="arrow"><span class="arrow-circle">→</span></span>
      </a>
      <a class="option" data-stage="lancando" href="lancando.html">
        <div class="label">Estou prestes a lançar</div>
        <span class="arrow"><span class="arrow-circle">→</span></span>
      </a>
      <a class="option" data-stage="publicado" href="publicado.html">
        <div class="label">Já lancei meu livro</div>
        <span class="arrow"><span class="arrow-circle">→</span></span>
      </a>
    </div>

    <footer>© The Book Business</footer>
  </div>

  <script>
    // Roteamento A/B percentual com sticky assignment
    // config.json: { escrevendo: { preco: 70, lista: 30 }, ... }
    // - Sorteia por % no primeiro acesso, salva em localStorage
    // - Mesmo visitante sempre vê a mesma versão (sticky)
    // - Injeta utm_test=<variant>-<stage> pra cruzamento no Hotmart
    (function() {
      function normalize(entry) {
        if (!entry) return { preco: 100, lista: 0 };
        if (typeof entry === 'string') {
          return entry === 'lista'
            ? { preco: 0, lista: 100 }
            : { preco: 100, lista: 0 };
        }
        return {
          preco: typeof entry.preco === 'number' ? entry.preco : 50,
          lista: typeof entry.lista === 'number' ? entry.lista : 50
        };
      }

      function pickVariant(pct) {
        var rand = Math.random() * 100;
        return (rand < pct.preco) ? 'preco' : 'lista';
      }

      function getStickyVariant(stage, entry) {
        var key = 'mtbb_variant_' + stage;
        try {
          var saved = localStorage.getItem(key);
          if (saved === 'preco' || saved === 'lista') return saved;
        } catch (e) {}
        var variant = pickVariant(normalize(entry));
        try { localStorage.setItem(key, variant); } catch (e) {}
        return variant;
      }

      function buildHref(stage, variant) {
        var base = (variant === 'lista') ? (stage + '-lista.html') : (stage + '.html');
        var utms = (window.MTBB_UTMS && window.MTBB_UTMS()) || {};
        utms.utm_test = variant + '-' + stage;
        var parts = [];
        Object.keys(utms).forEach(function (k) {
          parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(utms[k]));
        });
        return base + (parts.length ? '?' + parts.join('&') : '');
      }

      var bust = '?v=' + Date.now();
      fetch('config.json' + bust)
        .then(function(r) { return r.json(); })
        .then(function(cfg) {
          document.querySelectorAll('.option[data-stage]').forEach(function(el) {
            var stage = el.getAttribute('data-stage');
            var variant = getStickyVariant(stage, cfg[stage]);
            el.setAttribute('href', buildHref(stage, variant));
          });
        })
        .catch(function() {
          // fallback: mantém hrefs estáticos (preco)
        });
    })();
  </script>
</body>
</html>
