<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTBB · Em que momento está o seu livro?</title>
<meta name="description" content="Identifique o momento do seu livro e veja o caminho pra ele chegar aos leitores certos.">
<meta property="og:type" content="website">
<meta property="og:title" content="MTBB · Em que momento está o seu livro?">
<meta property="og:description" content="Identifique o momento do seu livro e veja o caminho pra ele chegar aos leitores certos.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fraunces:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F8F8F8;
    --bg-card: #FFFFFF;
    --bg-card-hover: #FFFFFF;
    --accent: #FAAB00;
    --text: #1A1A1A;
    --text-soft: #555555;
    --text-mute: #999999;
    --border: #EEEEEE;
  }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 40px 24px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 880px;
    width: 100%;
    margin: auto;
    text-align: center;
  }
  .logo {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
    margin-bottom: 36px;
  }
  .logo span { color: var(--accent); }
  h1 {
    font-size: clamp(30px, 5vw, 52px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin-bottom: 56px;
  }
  h1 .italic {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    max-width: 720px;
    margin: 0 auto;
  }
  @media (min-width: 760px) {
    .options { grid-template-columns: repeat(3, 1fr); gap: 18px; }
  }
  .option {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 32px 28px 28px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.25s ease;
    position: relative;
    min-height: 200px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    overflow: hidden;
  }
  .option::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .option:hover {
    border-color: var(--accent);
    transform: translateY(-6px);
    box-shadow: 0 22px 48px rgba(250,171,0,0.18), 0 4px 14px rgba(0,0,0,0.06);
  }
  .option:hover::before { transform: scaleX(1); }
  .option:hover .label { color: var(--text); }
  .option:hover .cta-pill {
    background: var(--accent);
    color: #0A0A0A;
    border-color: var(--accent);
  }
  .option:hover .cta-pill .arr { transform: translateX(4px); }
  .option .label {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 28px;
    transition: color 0.25s ease;
  }
  .cta-pill {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: transparent;
    border: 1.5px solid var(--text);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
    transition: all 0.25s ease;
  }
  .cta-pill .arr {
    display: inline-block;
    transition: transform 0.25s ease;
    font-weight: 700;
  }
  footer {
    margin-top: 64px;
    font-size: 12px;
    color: var(--text-mute);
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">MTBB<span>.</span></div>

    <h1>Em que momento está<br><span class="italic">o seu livro hoje?</span></h1>

    <div class="options">
      <a class="option" href="escrevendo.html">
        <div class="label">Ainda estou escrevendo</div>
        <span class="cta-pill">Ver caminho <span class="arr">→</span></span>
      </a>
      <a class="option" href="lancando.html">
        <div class="label">Estou prestes a lançar</div>
        <span class="cta-pill">Ver caminho <span class="arr">→</span></span>
      </a>
      <a class="option" href="publicado.html">
        <div class="label">Já lancei meu livro</div>
        <span class="cta-pill">Ver caminho <span class="arr">→</span></span>
      </a>
    </div>

    <footer>© The Book Business</footer>
  </div>
</body>
</html>
