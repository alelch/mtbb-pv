<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sonho · 20 versões</title>
<style>
@font-face { font-family: "Poppins"; font-weight: 300; src: url("../assets/fonts/poppins-300.woff2") format("woff2"); }
@font-face { font-family: "Poppins"; font-weight: 400; src: url("../assets/fonts/poppins-400.woff2") format("woff2"); }
@font-face { font-family: "Poppins"; font-weight: 500; src: url("../assets/fonts/poppins-500.woff2") format("woff2"); }
@font-face { font-family: "Poppins"; font-weight: 600; src: url("../assets/fonts/poppins-600.woff2") format("woff2"); }
@font-face { font-family: "Poppins"; font-weight: 700; src: url("../assets/fonts/poppins-700.woff2") format("woff2"); }
:root { --amber: #faab00; --ink: #fff; --ink-2: #c9c5bd; --ink-3: #8a867f; --line: #222126; --card: #121114;
  --g: #3fae84; --o: #fc783c; --y: #faab00;
  --gold: linear-gradient(100deg, #f6c453, #fde7a8 30%, #faab00 55%, #e08a00 80%, #f6c453); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: var(--ink); font-family: "Poppins", sans-serif; -webkit-font-smoothing: antialiased; }
.v { padding: 60px 20px 64px; border-top: 1px solid var(--line); text-align: center; overflow: hidden; }
.tag { display: inline-block; margin-bottom: 8px; padding: 6px 14px; border-radius: 99px; background: #2a1d00; color: var(--amber); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.why { max-width: 520px; margin: 0 auto 30px; font-size: 13px; color: var(--ink-3); }
.lead { font-size: 13px; font-weight: 300; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
.auto { margin-top: 36px; font-size: clamp(20px, 5.4vw, 28px); font-weight: 600; text-wrap: balance; }
.amber { color: var(--amber); }
svg.ic { width: 22px; height: 22px; stroke: var(--amber); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.box { max-width: 400px; margin: 26px auto 0; text-align: left; }
b { font-weight: 600; }
.t { display: block; font-size: 17px; font-weight: 600; line-height: 1.3; color: var(--ink); }
.s { display: block; margin-top: 2px; font-size: 14px; line-height: 1.4; color: var(--ink-2); }

/* 1 · caminho com ícones, refinado */
.v1 .st { position: relative; display: flex; gap: 16px; padding-bottom: 26px; }
.v1 .st:not(:last-child)::after { content: ""; position: absolute; left: 23px; top: 50px; bottom: 4px; width: 2px; background: linear-gradient(var(--amber), rgba(250,171,0,.12)); }
.v1 .dot { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--amber); box-shadow: 0 0 18px rgba(250,171,0,.25); }
.v1 .txt { padding-top: 3px; }

/* 2 · números grandes no caminho */
.v2 .st { position: relative; display: flex; gap: 18px; padding-bottom: 24px; }
.v2 .st:not(:last-child)::after { content: ""; position: absolute; left: 21px; top: 46px; bottom: 2px; width: 1px; background: #3a3833; }
.v2 .n { width: 44px; font-size: 30px; font-weight: 700; line-height: 1.2; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* 3 · trilho horizontal deslizante */
.v3 .rail { display: flex; gap: 0; margin: 26px -20px 0; padding: 0 20px 6px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.v3 .rail::-webkit-scrollbar { display: none; }
.v3 .st { flex: none; width: 72%; scroll-snap-align: center; text-align: left; padding-right: 14px; }
.v3 .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.v3 .top .dot { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--amber); }
.v3 .top .ln { flex: 1; height: 2px; background: linear-gradient(90deg, var(--amber), rgba(250,171,0,.15)); }
.v3 .hint { margin-top: 10px; font-size: 11px; color: var(--ink-3); }

/* 4 · degraus subindo */
.v4 .box { display: grid; gap: 10px; }
.v4 .st { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid #2a2930; border-radius: 14px; background: var(--card); }
.v4 .st:nth-child(2) { margin-left: 14px; } .v4 .st:nth-child(3) { margin-left: 28px; } .v4 .st:nth-child(4) { margin-left: 42px; } .v4 .st:nth-child(5) { margin-left: 56px; border-color: rgba(250,171,0,.6); background: rgba(250,171,0,.08); }
.v4 .t { font-size: 15px; } .v4 .s { font-size: 13px; }

/* 5 · estrada com o livro andando */
.v5 .road { position: relative; padding-left: 56px; }
.v5 .road::before { content: ""; position: absolute; left: 22px; top: 0; bottom: 0; width: 10px; border-radius: 6px; background: #1b1a1e; }
.v5 .road::after { content: ""; position: absolute; left: 26px; top: 8px; bottom: 8px; width: 2px; background: repeating-linear-gradient(var(--amber) 0 10px, transparent 10px 20px); }
.v5 .car { position: absolute; left: 13px; top: -6px; z-index: 2; width: 28px; height: 28px; border-radius: 8px; background: var(--amber); display: grid; place-items: center; box-shadow: 0 0 20px rgba(250,171,0,.6); }
.v5 .car svg { width: 16px; height: 16px; stroke: #000; fill: none; stroke-width: 2.2; }
.v5 .st { padding: 6px 0 22px; }

/* 6 · zigue-zague */
.v6 .zz { position: relative; max-width: 400px; margin: 26px auto 0; }
.v6 .zz::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(var(--amber), rgba(250,171,0,.1)); }
.v6 .st { position: relative; width: 50%; padding: 0 22px 26px 0; text-align: right; }
.v6 .st:nth-child(even) { margin-left: 50%; padding: 0 0 26px 22px; text-align: left; }
.v6 .st::after { content: ""; position: absolute; right: -6px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--amber); }
.v6 .st:nth-child(even)::after { left: -6px; right: auto; }
.v6 .t { font-size: 15px; } .v6 .s { font-size: 13px; }

/* 7 · painel do carro (luzes) */
.v7 .dash { max-width: 400px; margin: 26px auto 0; padding: 20px; border-radius: 22px; background: radial-gradient(ellipse at top, #1c1a16, #0a0a0b 70%); border: 1px solid #2a2930; text-align: left; display: grid; gap: 14px; }
.v7 .st { display: flex; align-items: center; gap: 14px; }
.v7 .led { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber), 0 0 22px rgba(250,171,0,.6); }
.v7 .t { font-size: 15px; } .v7 .s { font-size: 13px; }
.v7 .lab { margin-bottom: 4px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }

/* 8 · velocímetro */
.v8 .gauge { position: relative; width: 260px; height: 140px; margin: 26px auto 10px; }
.v8 .gauge svg { width: 100%; height: 100%; }
.v8 .list { max-width: 360px; margin: 0 auto; display: grid; gap: 10px; text-align: left; }
.v8 .st { display: flex; gap: 12px; align-items: baseline; }
.v8 .st i { flex: none; font-style: normal; font-size: 12px; font-weight: 700; color: var(--amber); width: 22px; }
.v8 .t { font-size: 15px; }

/* 9 · cartões ligados por linha */
.v9 .st { position: relative; display: flex; gap: 14px; align-items: center; padding: 16px; border: 1px solid #2a2930; border-radius: 16px; background: var(--card); }
.v9 .st + .st { margin-top: 22px; }
.v9 .st + .st::before { content: ""; position: absolute; left: 38px; top: -23px; height: 22px; width: 2px; background: var(--amber); }
.v9 .ico { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: rgba(250,171,0,.12); }

/* 10 · checagem do motor (interruptores ligados) */
.v10 .st { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.v10 .sw { flex: none; position: relative; width: 46px; height: 26px; border-radius: 99px; background: var(--amber); }
.v10 .sw::after { content: ""; position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #000; }
.v10 .t { font-size: 15px; } .v10 .s { font-size: 13px; }

/* 11 · barra de progresso ao lado */
.v11 .wrap11 { display: flex; gap: 18px; max-width: 400px; margin: 26px auto 0; text-align: left; }
.v11 .bar { flex: none; width: 6px; border-radius: 6px; background: #1d1c20; position: relative; overflow: hidden; }
.v11 .bar i { position: absolute; left: 0; right: 0; top: 0; height: 100%; background: linear-gradient(var(--amber), #e08a00); border-radius: 6px; }
.v11 .st { padding-bottom: 22px; }
.v11 .st:last-child { padding-bottom: 0; }

/* 12 · um passo por vez (deslize) */
.v12 .slides { display: flex; gap: 12px; margin: 26px -20px 0; padding: 0 20px 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.v12 .slides::-webkit-scrollbar { display: none; }
.v12 .sl { flex: none; width: 82%; min-height: 220px; scroll-snap-align: center; display: flex; flex-direction: column; justify-content: space-between; padding: 22px; border-radius: 20px; background: linear-gradient(160deg, #1a1712, #0b0b0d); border: 1px solid #2a2930; text-align: left; }
.v12 .sl .k { font-size: 48px; font-weight: 700; line-height: 1; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
.v12 .t { font-size: 20px; }

/* 13 · estrada em curva */
.v13 .curve { position: relative; max-width: 360px; margin: 26px auto 0; }
.v13 .curve svg.path { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.v13 .st { position: relative; display: flex; align-items: center; gap: 12px; height: 88px; text-align: left; }
.v13 .st:nth-child(odd of .st) { padding-left: 0; }
.v13 .pt { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #000; border: 1.5px solid var(--amber); z-index: 1; }
.v13 .t { font-size: 15px; } .v13 .s { font-size: 13px; }

/* 14 · nas cores das fases */
.v14 .st { position: relative; display: flex; gap: 16px; padding-bottom: 24px; }
.v14 .st:not(:last-child)::after { content: ""; position: absolute; left: 21px; top: 46px; bottom: 2px; width: 2px; background: var(--c); opacity: .5; }
.v14 .dot { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--c); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 45%, transparent); }
.v14 .dot svg.ic { stroke: var(--c); }

/* 15 · palavra-chave gigante */
.v15 .st { padding: 18px 0; border-bottom: 1px solid var(--line); text-align: center; }
.v15 .k { display: block; font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -.02em; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
.v15 .s { margin-top: 6px; font-size: 15px; }

/* 16 · o tempo passando */
.v16 .st { position: relative; display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.v16 .when { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); padding-top: 3px; }
.v16 .t { font-size: 15px; } .v16 .s { font-size: 13px; }

/* 17 · mini medidores */
.v17 .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 400px; margin: 26px auto 0; }
.v17 .m { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 10px; border-radius: 16px; background: var(--card); border: 1px solid #2a2930; }
.v17 .m:last-child { grid-column: 1 / -1; }
.v17 .ring { width: 54px; height: 54px; border-radius: 50%; background: conic-gradient(var(--amber) var(--p), #26252a 0); display: grid; place-items: center; }
.v17 .ring span { width: 42px; height: 42px; border-radius: 50%; background: var(--card); display: grid; place-items: center; }
.v17 .t { font-size: 14px; text-align: center; } .v17 .s { font-size: 12px; text-align: center; }

/* 18 · engrenagens */
.v18 .st { display: flex; align-items: center; gap: 14px; padding: 10px 0; }
.v18 .gear { flex: none; width: 46px; height: 46px; display: grid; place-items: center; animation: spin 8s linear infinite; }
.v18 .st:nth-child(even) .gear { animation-direction: reverse; }
.v18 .gear svg { width: 46px; height: 46px; fill: none; stroke: var(--amber); stroke-width: 1.6; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 19 · lista minimalista com fio que acende */
.v19 .st { position: relative; padding: 0 0 22px 22px; }
.v19 .st::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: linear-gradient(var(--amber), rgba(250,171,0,.2)); }
.v19 .st:last-child::before { bottom: 18px; }
.v19 .no { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 600; letter-spacing: .18em; color: var(--ink-3); }

/* 20 · tela dividida: pergunta fixa à esquerda */
.v20 .split { display: grid; grid-template-columns: 1fr; gap: 18px; max-width: 420px; margin: 26px auto 0; text-align: left; }
.v20 .big { font-size: 34px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
.v20 .big span { display: block; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
.v20 ul { list-style: none; display: grid; gap: 0; border-top: 1px solid var(--line); }
.v20 li { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.v20 li svg.ic { width: 20px; height: 20px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i0" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i1" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M9 7h6M9 11h6M9 15h3"/></symbol>
  <symbol id="i2" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 21h8"/></symbol>
  <symbol id="i3" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.4 6-5.4s5.4 2 6 5.4"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.6.2 4.4 2 5 5.4"/></symbol>
  <symbol id="i4" viewBox="0 0 24 24"><path d="M7.5 9c-2 0-3.5 1.4-3.5 3s1.5 3 3.5 3c3.5 0 5.5-6 9-6 2 0 3.5 1.4 3.5 3s-1.5 3-3.5 3c-3.5 0-5.5-6-9-6z"/></symbol>
  <symbol id="ibook" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></symbol>
  <symbol id="gear" viewBox="0 0 48 48"><circle cx="24" cy="24" r="8"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.9 9.9l4.2 4.2M33.9 33.9l4.2 4.2M9.9 38.1l4.2-4.2M33.9 14.1l4.2-4.2"/><circle cx="24" cy="24" r="15"/></symbol>
</svg>
<div id="root"></div>
<script>
var D = [
  { i: 'i0', t: 'Acordar com o plano pronto', s: 'o que fazer pelo livro, já definido.', k: 'Plano', w: 'Todo dia', c: 'var(--g)', p: '20%' },
  { i: 'i1', t: 'Abrir as redes com o post pensado', s: 'sem travar na tela em branco.', k: 'Post', w: 'Ao abrir as redes', c: 'var(--g)', p: '40%' },
  { i: 'i2', t: 'Aproveitar cada oportunidade', s: 'prêmios, feiras e editais.', k: 'Prêmios', w: 'Quando surgir uma chance', c: 'var(--o)', p: '60%' },
  { i: 'i3', t: 'Ganhar mais leitores', s: 'a cada ação.', k: 'Leitores', w: 'A cada ação', c: 'var(--o)', p: '80%' },
  { i: 'i4', t: 'E nunca mais ver o livro parar.', s: '', k: 'Sempre', w: 'Para sempre', c: 'var(--y)', p: '100%' }
];
function ic(id) { return '<svg class="ic"><use href="#' + id + '"/></svg>'; }
function txt(d) { return '<span class="t">' + d.t + '</span>' + (d.s ? '<span class="s">' + d.s + '</span>' : ''); }
var V = [
  ['Caminho com ícones, refinado', 'A D com mais respiro: ícone com brilho, título branco, complemento cinza.', function () { return '<div class="box">' + D.map(function (d) { return '<div class="st"><span class="dot">' + ic(d.i) + '</span><span class="txt">' + txt(d) + '</span></div>'; }).join('') + '</div>'; }],
  ['Números no caminho', 'Troca os ícones por 01 a 05 em dourado. Mais editorial, mostra que é uma sequência.', function () { return '<div class="box">' + D.map(function (d, n) { return '<div class="st"><span class="n">0' + (n + 1) + '</span><span>' + txt(d) + '</span></div>'; }).join('') + '</div>'; }],
  ['Trilho que desliza para o lado', 'Um passo por vez na horizontal, com a linha seguindo para o próximo. Ocupa pouca altura.', function () { return '<div class="rail">' + D.map(function (d) { return '<div class="st"><div class="top"><span class="dot">' + ic(d.i) + '</span><span class="ln"></span></div>' + txt(d) + '</div>'; }).join('') + '</div><p class="hint">deslize →</p>'; }],
  ['Degraus subindo', 'Cada sonho um degrau mais à direita, o último em destaque. O livro sobe.', function () { return '<div class="box">' + D.map(function (d) { return '<div class="st">' + ic(d.i) + '<span>' + txt(d) + '</span></div>'; }).join('') + '</div>'; }],
  ['Estrada com o livro andando', 'Uma pista tracejada e o livro no começo dela. Liga direto com o "motor".', function () { return '<div class="box road"><span class="car"><svg viewBox="0 0 24 24"><use href="#ibook"/></svg></span>' + D.map(function (d) { return '<div class="st">' + txt(d) + '</div>'; }).join('') + '</div>'; }],
  ['Zigue-zague', 'Linha no meio, sonhos alternando de lado. Mais dinâmico, mas o texto fica estreito.', function () { return '<div class="zz">' + D.map(function (d) { return '<div class="st">' + txt(d) + '</div>'; }).join('') + '</div>'; }],
  ['Painel do carro', 'Os sonhos como luzes acesas num painel. Tema motor, bem compacto.', function () { return '<div class="dash"><p class="lab">Motor do seu livro</p>' + D.map(function (d) { return '<div class="st"><span class="led"></span><span>' + txt(d) + '</span></div>'; }).join('') + '</div>'; }],
  ['Velocímetro', 'Um medidor no alto marcando o máximo, e a lista curta embaixo.', function () { return '<div class="gauge"><svg viewBox="0 0 260 140"><path d="M20 130 A110 110 0 0 1 240 130" fill="none" stroke="#26252a" stroke-width="14" stroke-linecap="round"/><path d="M20 130 A110 110 0 0 1 240 130" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round"/><defs><linearGradient id="gg"><stop offset="0" stop-color="#e08a00"/><stop offset="1" stop-color="#fde7a8"/></linearGradient></defs><line x1="130" y1="130" x2="222" y2="78" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="130" cy="130" r="9" fill="#faab00"/></svg></div><div class="list">' + D.map(function (d, n) { return '<div class="st"><i>0' + (n + 1) + '</i><span class="t">' + d.t + '</span></div>'; }).join('') + '</div>'; }],
  ['Cartões ligados', 'Cartões com ícone, presos por uma linha dourada. Mistura a A com a D.', function () { return '<div class="box">' + D.map(function (d) { return '<div class="st"><span class="ico">' + ic(d.i) + '</span><span>' + txt(d) + '</span></div>'; }).join('') + '</div>'; }],
  ['Checagem do motor', 'Cada sonho com um interruptor ligado. Lê como "tudo isso já vem ligado".', function () { return '<div class="box">' + D.map(function (d) { return '<div class="st"><span>' + txt(d) + '</span><span class="sw"></span></div>'; }).join('') + '</div>'; }],
  ['Barra de progresso', 'Uma barra dourada ao lado da lista, cheia até o fim. Sensação de avanço.', function () { return '<div class="wrap11"><span class="bar"><i></i></span><div>' + D.map(function (d) { return '<div class="st">' + txt(d) + '</div>'; }).join('') + '</div></div>'; }],
  ['Um passo por vez', 'Cartões grandes que deslizam, com a palavra-chave enorme. Cada sonho tem a tela só para ele.', function () { return '<div class="slides">' + D.map(function (d) { return '<div class="sl"><span class="k">' + d.k + '</span><span>' + txt(d) + '</span></div>'; }).join('') + '</div><p class="hint" style="font-size:11px;color:var(--ink-3);margin-top:10px">deslize →</p>'; }],
  ['Estrada em curva', 'O caminho faz uma curva suave entre os sonhos, como uma estrada vista de cima.', function () { var h = D.length * 88; return '<div class="curve" style="height:' + h + 'px"><svg class="path" viewBox="0 0 360 ' + h + '" preserveAspectRatio="none"><path d="M20 20 C 120 60, 120 120, 20 152 S 120 260, 20 284 S 120 390, 20 416" fill="none" stroke="#faab00" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 6"/></svg>' + D.map(function (d) { return '<div class="st"><span class="pt">' + ic(d.i) + '</span><span>' + txt(d) + '</span></div>'; }).join('') + '</div>'; }],
  ['Nas cores das fases', 'O caminho muda de cor: verde, laranja, amarelo, como o livro passando pelas fases do LOMBADA.', function () { return '<div class="box">' + D.map(function (d) { return '<div class="st" style="--c:' + d.c + '"><span class="dot">' + ic(d.i) + '</span><span>' + txt(d) + '</span></div>'; }).join('') + '</div>'; }],
  ['Palavra-chave gigante', 'Uma palavra grande por sonho (Plano, Post, Prêmios, Leitores, Sempre) e a frase pequena embaixo.', function () { return '<div class="box">' + D.map(function (d) { return '<div class="st"><span class="k">' + d.k + '</span><span class="s">' + d.t + (d.s ? ' · ' + d.s : '') + '</span></div>'; }).join('') + '</div>'; }],
  ['O tempo passando', 'Cada sonho com "quando acontece": todo dia, ao abrir as redes, a cada ação, para sempre.', function () { return '<div class="box">' + D.map(function (d) { return '<div class="st"><span class="when">' + d.w + '</span><span>' + txt(d) + '</span></div>'; }).join('') + '</div>'; }],
  ['Mini medidores', 'Cinco medidores enchendo até o último, cheio. Grade compacta.', function () { return '<div class="grid">' + D.map(function (d) { return '<div class="m"><span class="ring" style="--p:' + d.p + '"><span>' + ic(d.i) + '</span></span>' + txt(d) + '</div>'; }).join('') + '</div>'; }],
  ['Engrenagens', 'Cada sonho com uma engrenagem girando, uma no sentido da outra. O motor funcionando.', function () { return '<div class="box">' + D.map(function (d) { return '<div class="st"><span class="gear"><svg><use href="#gear"/></svg></span><span>' + txt(d) + '</span></div>'; }).join('') + '</div>'; }],
  ['Minimalista com fio', 'Só um fio dourado à esquerda e números pequenos. O mais limpo de todos.', function () { return '<div class="box">' + D.map(function (d, n) { return '<div class="st"><span class="no">0' + (n + 1) + '</span>' + txt(d) + '</div>'; }).join('') + '</div>'; }],
