<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>A virada · 10 versões</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--accent:#FC783C;--verde:#14523E;--ink:#3A3A38;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
body{margin:0;background:#0d0d0d;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}
.rot{position:sticky;top:0;z-index:20;background:#fff;color:#3A3A38;padding:11px 22px;
  font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.rot em{font-style:normal;font-weight:400;letter-spacing:.02em;text-transform:none;opacity:.6;margin-left:12px;font-size:12.5px}
.v{background:var(--verde);color:#fff;padding:clamp(64px,8vw,104px) 0;text-align:center}
.gk{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:0}
.olho{font-family:'Space Grotesk',sans-serif;font-size:.86rem;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:#fff;margin:0 0 16px}
.head{font-size:clamp(1.8rem,4.6vw,3rem);max-width:18ch;margin:0 auto}
.head b{color:var(--accent);font-weight:700}
.head i{font-style:normal;text-transform:uppercase;white-space:nowrap}
.pre{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.035em;
  font-size:clamp(1.3rem,3.2vw,2rem);line-height:1.14;margin:clamp(34px,4.4vw,52px) auto 0;max-width:26ch}
.perg{font-family:'Space Grotesk',sans-serif;font-weight:400;font-size:clamp(1.02rem,2.3vw,1.32rem);
  color:rgba(255,255,255,.72);margin:12px auto 0}
.rem{margin:clamp(40px,5vw,62px) auto 0;padding-top:clamp(30px,3.6vw,42px);
  border-top:1px solid rgba(255,255,255,.16);max-width:46ch}
.causa{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.035em;
  font-size:clamp(1.35rem,3.4vw,2.1rem);color:#fff;margin:0}
.des{font-family:'Space Grotesk',sans-serif;font-weight:400;font-size:clamp(1.05rem,2.4vw,1.4rem);
  color:rgba(255,255,255,.82);margin:12px 0 0}
.ser{font-family:'Fraunces',serif;font-style:italic;font-weight:500}
.eixo{display:flex;justify-content:space-between;font-family:'Space Grotesk',sans-serif;
  font-size:.64rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.txt{color:rgba(255,255,255,.72);font-size:1rem;line-height:1.5;margin:0}

/* 1 escada */
.g1 .esc{display:grid;grid-template-columns:repeat(12,1fr);row-gap:clamp(26px,3.4vw,44px);
  margin-top:clamp(38px,5vw,58px);text-align:left}
.g1 .eixo{grid-column:1/-1;margin-bottom:-10px}
.g1 h3{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.04em;
  font-size:clamp(1.5rem,3.9vw,2.6rem);line-height:1.02;white-space:nowrap;margin:0 0 12px}
.g1 .risca{display:block;height:2px;border-radius:2px;margin:0 0 12px;
  background:linear-gradient(90deg,#fff,rgba(255,255,255,.28))}
.g1 .a1{grid-column:1/-1}.g1 .a2{grid-column:5/-1}.g1 .a3{grid-column:9/-1}

/* 2 empilhamento */
.g2 .pil{margin-top:44px;display:grid;gap:10px;text-align:left}
.g2 .b{display:flex;align-items:center;gap:16px;border-radius:14px;padding:18px 22px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18)}
.g2 .b:nth-child(1){margin-right:34%}
.g2 .b:nth-child(2){margin-left:12%;margin-right:16%;background:rgba(255,255,255,.16)}
.g2 .b:nth-child(3){margin-left:26%;background:rgba(255,255,255,.24)}
.g2 h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.1rem,2.4vw,1.5rem);
  letter-spacing:-.03em;margin:0;white-space:nowrap}
.g2 .b p{margin:0;font-size:.9rem;color:rgba(255,255,255,.72)}

/* 3 corrente */
.g3 .cor{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;
  gap:0 clamp(10px,1.6vw,22px);margin-top:46px;text-align:left}
.g3 .no{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);
  border-radius:16px;padding:22px 20px}
.g3 h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.05rem,2.3vw,1.5rem);
  letter-spacing:-.03em;margin:0 0 8px}
.g3 .no p{margin:0;font-size:.9rem;color:rgba(255,255,255,.7)}
.g3 .liga{font-size:1.6rem;color:var(--accent);font-weight:700}

/* 4 curva composta */
.g4 .cv{margin-top:44px}
.g4 svg{width:100%;height:auto;overflow:visible}
.g4 .marca{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.06em;fill:#fff}
.g4 .dia{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.14em;fill:rgba(255,255,255,.5)}

/* 5 camadas */
.g5 .cam{position:relative;height:300px;margin-top:44px}
.g5 .fx{position:absolute;left:0;right:0;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.02em}
.g5 .f1{top:0;bottom:0;background:rgba(255,255,255,.05);font-size:clamp(1rem,2.2vw,1.4rem);align-items:flex-start;padding-top:16px}
.g5 .f2{top:56px;bottom:56px;background:rgba(255,255,255,.09);font-size:clamp(1rem,2.2vw,1.4rem);align-items:flex-start;padding-top:16px}
.g5 .f3{top:112px;bottom:112px;background:rgba(255,255,255,.16);font-size:clamp(1rem,2.2vw,1.4rem)}

/* 6 tipografia pura */
.g6 .tp{margin-top:44px;text-align:left}
.g6 .l{display:block;font-family:'Space Grotesk',sans-serif;font-weight:700;
  letter-spacing:-.05em;font-size:clamp(2.2rem,8vw,5.6rem);line-height:.98;color:#fff;
  border-bottom:1px solid rgba(255,255,255,.18);padding:16px 0}
.g6 .l sup{font-size:.2em;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.5);
  vertical-align:super;margin-left:10px}

/* 7 equacao */
.g7 .eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  gap:clamp(10px,2vw,26px);margin-top:48px}
.g7 .t{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.04em;
  font-size:clamp(1.3rem,3.4vw,2.4rem);color:#fff}
.g7 .x{font-family:'Space Grotesk',sans-serif;font-weight:400;font-size:clamp(1.2rem,3vw,2rem);
  color:var(--accent)}
.g7 .igual{margin-top:26px;font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:clamp(1.4rem,3.6vw,2.6rem);color:#fff}
.g7 .nota{margin-top:14px;color:rgba(255,255,255,.66);font-size:.98rem}

/* 8 um por bloco */
.g8 .bl{border-top:1px solid rgba(255,255,255,.16);padding:clamp(30px,4vw,48px) 0;text-align:left;
  display:grid;grid-template-columns:auto 1fr;gap:0 clamp(18px,3vw,40px);align-items:baseline}
.g8 .n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(2rem,5vw,3.6rem);
  color:rgba(255,255,255,.22);letter-spacing:-.05em;line-height:.85}
.g8 h3{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.04em;
  font-size:clamp(1.6rem,4.4vw,3rem);line-height:1;margin:0 0 10px}
.g8 .quando{display:block;font-family:'Space Grotesk',sans-serif;font-size:.7rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}

/* 9 ficha de plano */
.g9 .fh{margin-top:44px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);
  border-radius:16px;overflow:hidden;text-align:left}
.g9 .lin{display:grid;grid-template-columns:96px 1fr;gap:0 18px;padding:20px 24px;
  border-bottom:1px solid rgba(255,255,255,.12)}
.g9 .lin:last-child{border-bottom:0}
.g9 .dia{font-family:'Space Grotesk',sans-serif;font-size:.74rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);padding-top:4px}
.g9 h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.1rem,2.4vw,1.45rem);
  letter-spacing:-.03em;margin:0 0 5px}
.g9 .lin p{margin:0;font-size:.93rem;color:rgba(255,255,255,.7)}

/* 10 pergunta e resposta */
.g10 .qa{margin-top:44px;text-align:left;max-width:820px;margin-left:auto;margin-right:auto}
.g10 .q{font-family:'Fraunces',serif;font-style:italic;font-weight:500;
  font-size:clamp(1.1rem,2.6vw,1.6rem);color:rgba(255,255,255,.66);margin:0 0 6px}
.g10 .r{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.035em;
  font-size:clamp(1.5rem,3.8vw,2.4rem);color:#fff;margin:0 0 30px;line-height:1.06}
.g10 .r small{display:block;font-family:'DM Sans',sans-serif;font-weight:400;font-size:.42em;
  letter-spacing:0;color:rgba(255,255,255,.7);margin-top:8px}

@media(max-width:860px){
  .g3 .cor{grid-template-columns:1fr;gap:14px}.g3 .liga{transform:rotate(90deg);text-align:center}
  .g2 .b{margin:0 !important}
  .g1 .esc{row-gap:24px}.g1 .a1,.g1 .a2,.g1 .a3{grid-column:1/-1}.g1 h3{white-space:normal}
  .g9 .lin{grid-template-columns:1fr;gap:6px}
}
</style></head><body>
<script>
var ATOS=[['Crie desejo','O leitor compra o autor antes de comprar o livro.','dia 0 ao 90','01'],
          ['Gere antecipação','Quem estreia vendendo começou a vender semanas antes.','dia 30 ao 90','02'],
          ['Lance vendendo','Pedidos concentrados na primeira semana. E os trinta dias seguintes.','dia 60 ao 90','03']];
function topo(){return '<p class="olho">Seja a exceção</p>'+
  '<h2 class="gk head">O <b>1%</b> que vende <i>de verdade</i> no lançamento</h2>'+
  '<p class="gk pre">Ninguém compra um livro que não conhece.</p>'+
  '<p class="perg">Então como fazer conhecerem o seu?</p>';}
function fim(){return '<div class="rem"><p class="causa">Um potencializa o outro.</p>'+
  '<p class="des">Em noventa dias, o seu livro passa de <span class="ser">invisível a lido</span>.</p></div>';}
function sec(n,titulo,desc,miolo){
  document.write('<div class="rot">Versão '+n+' · '+titulo+' <em>'+desc+'</em></div>'+
    '<section class="v g'+n+'"><div class="wrap">'+topo()+miolo+fim()+'</div></section>');
}

sec(1,'Escada','a que está no ar: o texto é o gráfico, cada verbo começa mais tarde',
 '<div class="esc"><p class="eixo"><span>dia 0</span><span>30</span><span>60</span><span>90</span></p>'+
 ATOS.map(function(a,i){return '<div class="a'+(i+1)+'"><h3>'+a[0]+'</h3><span class="risca"></span><p class="txt">'+a[1]+'</p></div>'}).join('')+'</div>');

sec(2,'Empilhamento','cada faixa entra por cima e mais opaca: potencializar como acúmulo',
 '<div class="pil">'+ATOS.map(function(a){return '<div class="b"><h3>'+a[0]+'</h3><p>'+a[1]+'</p></div>'}).join('')+'</div>');

sec(3,'Corrente','três blocos ligados por sinal de mais: um empurra o outro',
 '<div class="cor">'+ATOS.map(function(a,i){return (i?'<span class="liga">+</span>':'')+
  '<div class="no"><h3>'+a[0]+'</h3><p>'+a[1]+'</p></div>'}).join('')+'</div>');

sec(4,'Curva composta','uma linha só que fica mais íngreme a cada ato que entra',
 '<div class="cv"><svg viewBox="0 0 900 300" fill="none">'+
 '<path d="M40,262 C180,258 300,244 420,208 C560,166 700,96 860,26" stroke="#fff" stroke-width="3" stroke-linecap="round"/>'+
 '<circle cx="40" cy="262" r="6" fill="#fff"/><circle cx="420" cy="208" r="6" fill="#fff"/><circle cx="700" cy="96" r="6" fill="#fff"/>'+
 '<text class="marca" x="40" y="240">Crie desejo</text>'+
 '<text class="marca" x="420" y="186">Gere antecipação</text>'+
 '<text class="marca" x="700" y="74">Lance vendendo</text>'+
 '<text class="dia" x="40" y="288">DIA 0</text><text class="dia" x="420" y="288">30</text>'+
 '<text class="dia" x="700" y="288">60</text><text class="dia" x="860" y="288">90</text>'+
 '</svg></div>');

sec(5,'Camadas','anéis que se encaixam, parente do desenho das bolhas lá em cima',
 '<div class="cam"><div class="fx f1">'+ATOS[0][0]+'</div><div class="fx f2">'+ATOS[1][0]+
 '</div><div class="fx f3">'+ATOS[2][0]+'</div></div>');

sec(6,'Tipografia pura','sem gráfico nenhum: os três verbos ocupam a seção',
 '<div class="tp">'+ATOS.map(function(a){return '<span class="l">'+a[0]+'<sup>'+a[2]+'</sup></span>'}).join('')+'</div>');

sec(7,'Equação','multiplicação é literalmente potencialização',
 '<div class="eq"><span class="t">Desejo</span><span class="x">×</span><span class="t">Antecipação</span>'+
 '<span class="x">×</span><span class="t">Venda</span></div>'+
 '<p class="igual">= um livro lido</p>'+
 '<p class="nota">Se qualquer um for zero, o resultado é zero.</p>');

sec(8,'Um por bloco','cada ato ocupa a sua faixa, tipo grande, separados por fio',
 ATOS.map(function(a){return '<div class="bl"><span class="n">'+a[3]+'</span><div>'+
  '<span class="quando">'+a[2]+'</span><h3>'+a[0]+'</h3><p class="txt">'+a[1]+'</p></div></div>'}).join(''));

sec(9,'Ficha de plano','parece o documento que você recebe, não um argumento',
 '<div class="fh">'+ATOS.map(function(a){return '<div class="lin"><span class="dia">'+a[2]+
  '</span><div><h3>'+a[0]+'</h3><p>'+a[1]+'</p></div></div>'}).join('')+'</div>');

sec(10,'Pergunta e resposta','a seção inteira como conversa, três perguntas e três respostas',
 '<div class="qa">'+
 '<p class="q">Como alguém quer um livro que ainda não existe?</p><p class="r">Crie desejo<small>O leitor compra o autor antes de comprar o livro.</small></p>'+
 '<p class="q">E como ele chega na estreia já querendo?</p><p class="r">Gere antecipação<small>Quem estreia vendendo começou a vender semanas antes.</small></p>'+
 '<p class="q">E como isso vira venda?</p><p class="r">Lance vendendo<small>Pedidos concentrados na primeira semana. E os trinta dias seguintes.</small></p>'+
 '</div>');
</script>
</body></html>
