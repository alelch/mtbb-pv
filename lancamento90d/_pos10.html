<!doctype html><meta charset="utf-8"><body style="margin:0;font:12px monospace;white-space:pre">
<iframe id="f" src="virada10.html" style="border:0;width:1280px;height:830px;position:absolute;left:-9999px"></iframe><div id="o"></div>
<script>document.getElementById('f').onload=function(){setTimeout(function(){
var d=this.contentDocument,w=this.contentWindow,L=[];
[].forEach.call(d.querySelectorAll('section'),function(e,i){
  L.push('v'+(i+1)+' topo='+Math.round(e.getBoundingClientRect().top+w.scrollY)+' alt='+Math.round(e.getBoundingClientRect().height));});
document.getElementById('o').textContent=L.join('\n');document.title='pronto';}.bind(this),1200)};</script></body>
