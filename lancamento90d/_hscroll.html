<!doctype html><meta charset="utf-8"><body style="margin:0;font:14px monospace;white-space:pre">
<iframe id="f" src="index.html?v=21" style="border:0;width:390px;height:844px;position:absolute;left:-9999px"></iframe><div id="o"></div>
<script>document.getElementById('f').onload=function(){setTimeout(function(){
var d=this.contentDocument,e=d.documentElement,L=[];
L.push('viewport   = '+e.clientWidth);
L.push('scrollWidth= '+e.scrollWidth);
L.push(e.scrollWidth>e.clientWidth+1 ? 'ESTOURA '+(e.scrollWidth-e.clientWidth)+'px na horizontal'
                                     : 'sem rolagem horizontal');
L.push('pista overflow = '+getComputedStyle(d.querySelector('.press-pista')).overflow);
document.getElementById('o').textContent=L.join('\n');document.title='pronto';}.bind(this),1400)};</script></body>
