<!doctype html><meta charset=utf-8><title>rev</title>
<style>html,body{margin:0}
#f{position:fixed;inset:0;width:1280px;height:900px;border:0}
#o{position:fixed;inset:0;z-index:9;background:#111;color:#0f0;font:13px ui-monospace;white-space:pre;padding:8px}</style>
<iframe id=f src="index.html"></iframe><div id=o>...</div>
<script>
var f=document.getElementById('f'),L=[],erros=[];
f.onload=function(){
  var d=f.contentDocument,w=f.contentWindow;
  w.addEventListener('error',function(e){erros.push(e.message)});
  var st=d.createElement('style');st.textContent='html{scroll-behavior:auto!important}';d.head.appendChild(st);
  setTimeout(function(){
    var c=d.querySelector('.curva'), rev=d.getElementById('revelaR');
    var marcas=[].slice.call(d.querySelectorAll('.curva [data-x]'));
    L.push('forcar medida: '+(typeof w.__curva));
    var vh=w.innerHeight, alvoY=c.getBoundingClientRect().top+w.scrollY;
    L.push('vh='+vh+'  topo da curva no doc='+Math.round(alvoY));
    [1.10,0.90,0.75,0.60,0.45,0.34,0.20,-0.30].forEach(function(k){
      w.scrollTo(0,Math.max(0,alvoY-vh*k));
      if(w.__curva) w.__curva();
      var vis=marcas.filter(function(e){return (e.style.opacity||'0')==='1'})
                    .map(function(e){var t=(e.textContent||'').trim();return t||e.getAttribute('class').replace('no ','')});
      L.push('k='+String(k).padEnd(6)+' larg='+String(rev.getAttribute('width')).padEnd(6)+
             ' acesos['+vis.length+']: '+vis.join(' · '));
    });
    // e no fim da pagina
    w.scrollTo(0,d.documentElement.scrollHeight); if(w.__curva) w.__curva();
    var esc=marcas.filter(function(e){return (e.style.opacity||'0')!=='1'});
    L.push('');L.push('fim da pagina, ainda apagados: '+esc.length);
    L.push('ERROS JS: '+(erros.length?erros.join(' ;; '):'nenhum'));
    document.getElementById('o').textContent=L.join('\n');
  },2400);
};
</script>
