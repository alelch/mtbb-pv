<!doctype html><meta charset="utf-8"><body style="margin:0;font:13px monospace;white-space:pre">
<iframe id="f" src="index.html" style="border:0;width:1280px;height:830px;position:absolute;left:-9999px"></iframe><div id="o"></div>
<script>document.getElementById('f').onload=function(){setTimeout(function(){
var d=this.contentDocument,w=this.contentWindow,L=[];
[].forEach.call(d.querySelectorAll('.grifo,.risco,.serifa,.mao'),function(e){
  var y=Math.round(e.getBoundingClientRect().top+w.scrollY);
  L.push(e.className.padEnd(14)+' y='+String(y).padStart(6)+'  "'+e.textContent.trim().slice(0,34)+'"');});
document.getElementById('o').textContent=L.join('\n');document.title='pronto';}.bind(this),1400)};</script></body>
