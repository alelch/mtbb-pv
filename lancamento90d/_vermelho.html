<!doctype html><meta charset="utf-8"><body style="margin:0;background:#111">
<div id="g"></div><script>
var cores=[['#7A1F16','3,88:1'],['#6E1A12','4,34:1'],['#5C1710','4,98:1']];
cores.forEach(function(par){
  var d=document.createElement('div');
  d.style.cssText='position:relative;width:642px;height:300px;overflow:hidden;float:left;border:1px solid #000';
  d.innerHTML='<span style="position:absolute;left:0;top:0;z-index:9;background:#111;color:#fff;'+
    'font:11px monospace;padding:3px 8px">'+par[0]+'  '+par[1]+'</span>';
  var f=document.createElement('iframe');
  f.src='index.html?v=120'; f.style.cssText='border:0;width:1284px;height:600px;transform:scale(.5);transform-origin:0 0';
  f.onload=function(){ var w=f.contentWindow, doc=f.contentDocument;
    var s=doc.createElement('style');
    s.textContent='html{scroll-behavior:auto!important}*{transition:none!important}'+
      '.cem i{background:'+par[0]+' !important}.cem i.viva{background:#fff !important}';
    doc.head.appendChild(s);
    setTimeout(function(){
      var sec=doc.querySelector('.noventa');
      w.scrollTo(0, sec.getBoundingClientRect().top+w.scrollY+40);
      w.__cem&&w.__cem();
      document.title='pronto';
    },900); };
  d.appendChild(f); document.getElementById('g').appendChild(d);
});
</script></body>
