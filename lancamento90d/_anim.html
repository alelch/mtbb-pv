<!doctype html><meta charset=utf-8>
<style>html,body{margin:0;background:#111}iframe{border:0;display:block}</style>
<iframe id=f src="index.html" style="width:390px;height:360px"></iframe>
<script>
document.getElementById('f').onload=function(){var d=this.contentDocument,w=this.contentWindow;
  var st=d.createElement('style');st.textContent='html{scroll-behavior:auto!important}';d.head.appendChild(st);
  setTimeout(function(){
    var e=d.querySelector('.marquee.prova');
    w.scrollTo(0,e.getBoundingClientRect().top+w.scrollY-60);
    Object.keys(w).filter(function(k){return k.indexOf('__')===0&&typeof w[k]==='function'})
      .forEach(function(k){try{w[k]()}catch(x){}});
    document.title='pronto';
  },2200);
};
</script>
