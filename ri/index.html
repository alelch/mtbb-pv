<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Redirecionando…</title>
<script>
/* Ponte de checkout do botão do vídeo (VTurb) — IMERSÃO Lançamento que Vende.
   Gêmea da /r/ (que é da MasterClass), mas com produto e cookies PRÓPRIOS.

   Por que existe: o botão do vídeo abre uma URL fixa (esta). Aqui lemos o cookie 'lqv_checkout'
   que a página lancamento-v1 gravou com o checkout da VARIANTE do visitante (A/B) + sck + utms,
   anexamos o xcod da VTurb (cookie 'lqv_xcod') e redirecionamos. Assim o botão do vídeo respeita
   o teste A/B de checkout E a VTurb continua marcando a conversão do vídeo.
   (Na master, ligar o teste de checkout sem esta ponte apagou o xcod em 01/08.)

   ⚠️ Cookies lqv_* (não mv_*): se compartilhasse o cookie com a master, um visitante que passou
   pelas duas páginas seria mandado pro PRODUTO ERRADO. A checagem de PRODUTO abaixo é a 2ª rede. */
(function(){
  var PRODUTO = 'D104614574Y';                       // Imersão Lançamento que Vende
  var OFF_A   = 'yaskbrlp';                          // A = 3 order bumps
  var OFF_B   = 'urz2moj1';                          // B = 1 order bump (só gravação)

  function ck(n){ var m=document.cookie.match('(^|;)\\s*'+n+'\\s*=\\s*([^;]+)'); return m?decodeURIComponent(m[2]):null; }

  var url = ck('lqv_checkout');
  // só aceita o cookie se for checkout da Hotmart E do produto da Imersão (blinda contra cookie de outro produto)
  if(!url || url.indexOf('hotmart.com') < 0 || url.indexOf(PRODUTO) < 0){
    // fallback: usa a VARIANTE real do visitante (cookie sticky do teste);
    // se nem isso existir, sorteia 50/50 — nunca enviesa pra um lado.
    var v = ck('ab_lancamento-v1-checkout');
    if(v !== 'A' && v !== 'B') v = (Math.random() < 0.5 ? 'A' : 'B');
    var off = (v === 'B') ? OFF_B : OFF_A;
    var base = 'https://pay.hotmart.com/' + PRODUTO + '?off=' + off + '&checkoutMode=10';
    url = base + '&src=lancamento-v1%7Cvturb%7C%7C%7C%7C%7Cck' + v + '&sck=lancamento-v1|vturb|||||ck' + v;
  }
  // anexa o xcod da VTurb (capturado pela página) p/ a VTurb continuar marcando a conversão do vídeo
  var xcod = ck('lqv_xcod');
  if(xcod && url.indexOf('xcod=') < 0){ url += (url.indexOf('?') < 0 ? '?' : '&') + 'xcod=' + encodeURIComponent(xcod); }
  location.replace(url);
})();
</script>
</head>
<body style="margin:0;background:#0f0f10;color:#c9c9c9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div style="text-align:center">
    <div style="width:34px;height:34px;border:3px solid #333;border-top-color:#fbbd23;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite"></div>
    Levando você pro checkout…
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  <noscript><meta http-equiv="refresh" content="0;url=https://pay.hotmart.com/D104614574Y?off=yaskbrlp&checkoutMode=10"></noscript>
</body>
</html>
